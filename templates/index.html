<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 450px; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; height: 85vh; }
        .chat-header { background: #1a73e8; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 10px 15px; border-radius: 8px; max-width: 80%; line-height: 1.4; word-wrap: break-word; }
        .user-message { background: #1a73e8; color: white; align-self: flex-end; }
        .bot-message { background: #f1f3f4; color: #333; align-self: flex-start; }
        .chat-input { display: flex; border-top: 1px solid #ddd; padding: 10px; background: #fff; }
        .chat-input input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; outline: none; font-size: 14px; }
        .chat-input button { background: #1a73e8; color: white; border: none; padding: 10px 20px; margin-left: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .chat-input button:hover { background: #1557b0; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Gemini AI Chatbot</div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">হ্যালো! আমি আপনার জেমিনি এআই সহকারী। আজ আপনাকে কীভাবে সাহায্য করতে পারি?</div>
        </div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="আপনার বার্তা এখানে লিখুন..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">পাঠান</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const message = inputField.value.trim();
            if (!message) return;

            const chatMessages = document.getElementById("chatMessages");
            chatMessages.innerHTML += `<div class="message user-message">${message}</div>`;
            inputField.value = "";
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message })
                });
                const data = await response.json();
                
                if (data.reply) {
                    chatMessages.innerHTML += `<div class="message bot-message">${data.reply}</div>`;
                } else {
                    chatMessages.innerHTML += `<div class="message bot-message">দুঃখিত, কোনো সমস্যা হয়েছে।</div>`;
                }
            } catch (error) {
                chatMessages.innerHTML += `<div class="message bot-message">সার্ভার কানেকশনে ত্রুটি দেখা দিয়েছে।</div>`;
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
